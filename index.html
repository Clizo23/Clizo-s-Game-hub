<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clizo's Games</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0b10;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Click To Enter Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            z-index: 100;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }
        #splash-screen h1 {
            font-size: 42px;
            letter-spacing: 4px;
            color: #00e5ff;
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.7), 0 0 30px rgba(0, 229, 255, 0.4);
            text-align: center;
            text-transform: uppercase;
        }
        #splash-screen .click-prompt {
            font-size: 14px;
            letter-spacing: 3px;
            color: #55ffb0;
            text-shadow: 0 0 8px rgba(85, 255, 176, 0.5);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        /* Hub Main Container */
        #hub-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            position: relative;
        }

        /* Carousel Area */
        .carousel-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            width: 100%;
            max-width: 900px;
            padding: 20px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            z-index: 10;
        }
        .nav-btn:hover {
            background: rgba(0, 229, 255, 0.2);
            border-color: #00e5ff;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
        }

        .game-card {
            background: rgba(20, 20, 30, 0.85);
            border: 2px solid rgba(0, 229, 255, 0.3);
            border-radius: 12px;
            width: 540px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,229,255,0.05);
            transition: transform 0.3s ease;
        }

        .game-preview {
            width: 100%;
            height: 260px;
            background: #111118;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            position: relative;
        }

        .game-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .game-tag {
            font-size: 11px;
            color: #00e5ff;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .game-title {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .game-desc {
            font-size: 13px;
            color: #aaa;
            line-height: 1.4;
        }

        .play-game-btn {
            margin-top: 6px;
            background: #00e5ff;
            color: #0b0b10;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
            transition: all 0.2s ease;
            text-align: center;
            text-decoration: none;
        }
        .play-game-btn:hover {
            background: #33ecff;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.7);
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <!-- Splash Screen matching reference 1 -->
    <div id="splash-screen" onclick="enterHub()">
        <h1>Clizo's Games</h1>
        <div class="click-prompt">CLICK TO ENTER</div>
    </div>

    <!-- Hub Carousel matching reference 2 -->
    <div id="hub-container">
        <div class="carousel-wrapper">
            <button class="nav-btn" onclick="prevGame()">&#10094;</button>
            
            <div class="game-card" id="cardContainer">
                <div class="game-preview" id="gamePreviewBox">
                    <!-- Dynamic preview / image placeholder -->
                    <div style="color: #555; font-size: 13px;">Game Preview</div>
                </div>
                <div class="game-info">
                    <div class="game-tag" id="gameTag">CH 01</div>
                    <div class="game-title" id="gameTitle">Ball Pistol Duel</div>
                    <div class="game-desc" id="gameDesc">Multiplayer 2D ball shooter with abilities, custom maps, and account matchmaking.</div>
                </div>
                <a href="#" id="gameLink" class="play-game-btn" target="_blank">Play Game</a>
            </div>

            <button class="nav-btn" onclick="nextGame()">&#10095;</button>
        </div>
    </div>

    <script>
        // List your games here! You can add as many as you want.
        const games = [
            {
                tag: "CH 01",
                title: "Ball Pistol Duel",
                desc: "Multiplayer 2D ball shooter featuring 8 unique abilities, custom map layouts, and online account matchmaking.",
                link: "https://your-ball-game-vercel-link.vercel.app", // Put your Vercel game link here
                image: "" // Optional: Image URL if you want a thumbnail preview
            },
            {
                tag: "CH 02",
                title: "Coming Soon Game 2",
                desc: "Another awesome webport or independent project coming soon to Clizo's Hub.",
                link: "#",
                image: ""
            }
        ];

        let currentIndex = 0;

        function enterHub() {
            const splash = document.getElementById('splash-screen');
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.display = 'none';
                document.getElementById('hub-container').style.display = 'flex';
                updateGameCard();
            }, 500);
        }

        function updateGameCard() {
            const game = games[currentIndex];
            document.getElementById('gameTag').innerText = game.tag;
            document.getElementById('gameTitle').innerText = game.title;
            document.getElementById('gameDesc').innerText = game.desc;
            document.getElementById('gameLink').href = game.link;
            
            const previewBox = document.getElementById('gamePreviewBox');
            if (game.image) {
                previewBox.innerHTML = `<img src="${game.image}" alt="${game.title}">`;
            } else {
                previewBox.innerHTML = `<div style="color: #444; font-size: 14px; letter-spacing: 1px;">${game.title}</div>`;
            }
        }

        function nextGame() {
            currentIndex = (currentIndex + 1) % games.length;
            updateGameCard();
        }

        function prevGame() {
            currentIndex = (currentIndex - 1 + games.length) % games.length;
            updateGameCard();
        }
    </script>
</body>
</html>
