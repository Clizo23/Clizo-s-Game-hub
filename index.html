<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clizo's Games</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0b10;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            z-index: 100;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }
        #splash-screen h1 {
            font-size: 42px;
            letter-spacing: 4px;
            color: #00e5ff;
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.7), 0 0 30px rgba(0, 229, 255, 0.4);
            text-align: center;
            text-transform: uppercase;
        }
        #splash-screen .click-prompt {
            font-size: 14px;
            letter-spacing: 3px;
            color: #55ffb0;
            text-shadow: 0 0 8px rgba(85, 255, 176, 0.5);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        /* Hub Container */
        #hub-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            position: relative;
        }

        .carousel-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            width: 100%;
            max-width: 900px;
            padding: 20px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            z-index: 10;
        }
        .nav-btn:hover {
            background: rgba(0, 229, 255, 0.2);
            border-color: #00e5ff;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
        }

        .game-card {
            background: rgba(20, 20, 30, 0.85);
            border: 2px solid rgba(0, 229, 255, 0.3);
            border-radius: 12px;
            width: 540px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,229,255,0.05);
        }

        /* CSS Retraced Action Scene Preview */
        .game-preview {
            width: 100%;
            height: 260px;
            background: linear-gradient(135deg, #4b526d 0%, #767d96 100%);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            position: relative;
        }

        .preview-scene {
            width: 100%;
            height: 100%;
            position: relative;
            transform: rotate(-30deg) scale(1.15);
            transform-origin: center center;
        }

        .track {
            position: absolute;
            top: 50%;
            left: -20%;
            width: 140%;
            height: 90px;
            background: #2b2b36;
            border-top: 6px solid #1a1a24;
            border-bottom: 6px solid #1a1a24;
            transform: translateY(-50%);
        }

        .ball-blue {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 130px;
            height: 130px;
            background: radial-gradient(circle at 30% 30%, #00a2ff, #0055ff);
            border-radius: 50%;
            border: 5px solid #181920;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .ball-red {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 130px;
            height: 130px;
            background: radial-gradient(circle at 30% 30%, #ff0077, #d00040);
            border-radius: 50%;
            border: 5px solid #181920;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .gun-blue {
            position: absolute;
            left: 110px;
            top: 50%;
            transform: translateY(-50%);
            width: 70px;
            height: 40px;
            background: #ffb703;
            border-radius: 4px;
            box-shadow: -2px 2px 0px #c78800;
        }
        .gun-blue::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 15px;
            width: 20px;
            height: 20px;
            background: #ffb703;
            transform: skewX(-15deg);
        }

        .gun-red {
            position: absolute;
            right: 110px;
            top: 50%;
            transform: translateY(-50%) scaleX(-1);
            width: 70px;
            height: 40px;
            background: #ffb703;
            border-radius: 4px;
            box-shadow: 2px 2px 0px #c78800;
        }
        .gun-red::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 15px;
            width: 20px;
            height: 20px;
            background: #ffb703;
            transform: skewX(-15deg);
        }

        .bullet-blue-shot {
            position: absolute;
            left: 200px;
            top: 48%;
            width: 14px;
            height: 8px;
            background: #00d2ff;
            border-radius: 4px;
            box-shadow: 0 0 8px #00d2ff;
        }
        .bullet-blue-shot-2 {
            position: absolute;
            left: 225px;
            top: 43%;
            width: 12px;
            height: 8px;
            background: #00d2ff;
            border-radius: 4px;
            box-shadow: 0 0 8px #00d2ff;
        }

        .bullet-red-shot {
            position: absolute;
            right: 200px;
            top: 45%;
            width: 14px;
            height: 8px;
            background: #ff0055;
            border-radius: 4px;
            box-shadow: 0 0 8px #ff0055;
        }
        .bullet-red-shot-2 {
            position: absolute;
            right: 225px;
            top: 52%;
            width: 12px;
            height: 8px;
            background: #ff0055;
            border-radius: 4px;
            box-shadow: 0 0 8px #ff0055;
        }

        .game-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .game-tag {
            font-size: 11px;
            color: #00e5ff;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .game-title {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .game-desc {
            font-size: 13px;
            color: #aaa;
            line-height: 1.4;
        }

        .play-game-btn {
            margin-top: 6px;
            background: #00e5ff;
            color: #0b0b10;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
            transition: all 0.2s ease;
            text-align: center;
            text-decoration: none;
        }
        .play-game-btn:hover {
            background: #33ecff;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.7);
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <!-- Splash Screen with direct click handler -->
    <div id="splash-screen" onclick="enterHub()">
        <h1>Clizo's Games</h1>
        <div class="click-prompt">CLICK TO ENTER</div>
    </div>

    <!-- Hub Carousel -->
    <div id="hub-container">
        <div class="carousel-wrapper">
            <button class="nav-btn" onclick="prevGame()">&#10094;</button>
            
            <div class="game-card" id="cardContainer">
                <div class="game-preview">
                    <div class="preview-scene">
                        <div class="track"></div>
                        <div class="ball-blue"></div>
                        <div class="gun-blue"></div>
                        <div class="bullet-blue-shot"></div>
                        <div class="bullet-blue-shot-2"></div>
                        
                        <div class="ball-red"></div>
                        <div class="gun-red"></div>
                        <div class="bullet-red-shot"></div>
                        <div class="bullet-red-shot-2"></div>
                    </div>
                </div>

                <div class="game-info">
                    <div class="game-tag" id="gameTag">CH 01</div>
                    <div class="game-title" id="gameTitle">Ball Pistol Duel</div>
                    <div class="game-desc" id="gameDesc">Multiplayer 2D ball shooter featuring 8 unique abilities, custom map layouts, and online account matchmaking.</div>
                </div>
                <a href="https://your-ball-game-vercel-link.vercel.app" id="gameLink" class="play-game-btn" target="_blank">Play Game</a>
            </div>

            <button class="nav-btn" onclick="nextGame()">&#10095;</button>
        </div>
    </div>

    <script>
        const games = [
            {
                tag: "CH 01",
                title: "Ball Pistol Duel",
                desc: "Multiplayer 2D ball shooter featuring 8 unique abilities, custom map layouts, and online account matchmaking.",
                link: "https://your-ball-game-vercel-link.vercel.app"
            },
            {
                tag: "CH 02",
                title: "Coming Soon Game 2",
                desc: "Another awesome webport or independent project coming soon to Clizo's Hub.",
                link: "#"
            }
        ];

        let currentIndex = 0;

        function enterHub() {
            const splash = document.getElementById('splash-screen');
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.display = 'none';
                document.getElementById('hub-container').style.display = 'flex';
            }, 500);
        }

        function updateGameCard() {
            const game = games[currentIndex];
            document.getElementById('gameTag').innerText = game.tag;
            document.getElementById('gameTitle').innerText = game.title;
            document.getElementById('gameDesc').innerText = game.desc;
            document.getElementById('gameLink').href = game.link;
        }

        function nextGame() {
            currentIndex = (currentIndex + 1) % games.length;
            updateGameCard();
        }

        function prevGame() {
            currentIndex = (currentIndex - 1 + games.length) % games.length;
            updateGameCard();
        }
    </script>
</body>
</html>
